[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "okru-sdk"
version = "0.1.0"
description = "Python-клиент для API ok.ru: OAuth2, подпись запросов, типизированные модели"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Шевцов Семён Валентинович", email = "shevtcov.sva@dvfu.ru" },
    { name = "Гайнутдинов Роман Алексеевич", email = "gainutdinov.ra@dvfu.ru" },
]
keywords = ["odnoklassniki", "ok.ru", "api", "sdk", "oauth2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "responses>=0.24",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/getrismine/okru-sdk"
Issues = "https://github.com/getrismine/okru-sdk/issues"
Changelog = "https://github.com/getrismine/okru-sdk/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/okru"]

[tool.hatch.build.targets.sdist]
include = [
    "src/okru",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=okru --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # длинные строки бывают в ссылках/сигнатурах — ок
